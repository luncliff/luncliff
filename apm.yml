name: luncliff-workspace
version: 0.0.0
description: luncliff's GitHub Workspace
author: luncliff

targets:
- copilot
# - claude
dependencies:
  apm:
  - github/awesome-copilot#fb4eb04fcbd30de50052b1155d81167393dfb5aa # 2026-09-15
  - epoko77-ai/im-not-ai#v2.3.2
  - openai/skills/skills/.curated/openai-docs#main
  - openai/skills/skills/.curated/playwright#main
  - openai/skills/skills/.curated/playwright-interactive#main
  - openai/skills/skills/.curated/define-goal#main
  - openai/skills/skills/.curated/security-best-practices#main
  - openai/skills/skills/.curated/gh-address-comments#main
  - openai/skills/skills/.curated/gh-fix-ci#main
  - mattpocock/skills/skills/engineering/code-review#v1.2.3
  - mattpocock/skills/skills/engineering/research#v1.2.3
  - mattpocock/skills/skills/engineering/improve-codebase-architecture#v1.2.3
  - mattpocock/skills/skills/productivity/grilling#v1.2.3
  - mattpocock/skills/skills/productivity/teach#v1.2.3
  - mattpocock/skills/skills/productivity/to-questionnaire#v1.2.3
  - mattpocock/skills/skills/productivity/writing-for-agents#v1.2.3
  mcp:
  - microsoft/playwright-mcp
  - name: github
    registry: false
    transport: http
    url: https://api.githubcopilot.com/mcp
  - name: memory
    registry: false
    transport: stdio
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-memory'
  - name: filesystem
    registry: false
    transport: stdio
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - .
  - name: legalize-kr
    registry: false
    transport: stdio
    command: uvx
    args:
    - --with
    - mcp==1.29.0
    - --from
    - legalize-cli[mcp]==0.4.0
    - legalize-mcp
