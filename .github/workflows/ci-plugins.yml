name: Plugin CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-plugins-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate plugin catalogs
        run: node scripts/validate-plugins.mjs

      - name: Install lint dependencies
        run: npm ci

      - name: Lint JSON
        run: npm exec -- eslint .github/plugin.json .github/plugin/marketplace.json .agents/plugins/marketplace.json

      - name: Lint Markdown
        run: npm exec -- markdownlint-cli2 --no-globs "README.md" "references.md" ".github/agents/**/*.md" ".github/com.github.copilot/**/*.md" ".github/skills/**/*.md"